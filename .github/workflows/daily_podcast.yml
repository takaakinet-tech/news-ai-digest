name: Hourly AI Podcast Digest

on:
  schedule:
    # 毎時17分に全ポッドキャストの更新を一斉チェック（GitHubの混雑遅延を避けるため17分に設定）
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser python-dotenv
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check & Run BBC Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/bbc_digest.py || echo "BBC failed"

      - name: Check & Run NYT Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/nyt_daily_digest.py || echo "NYT failed"

      - name: Check & Run Komugiko Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/komugiko_daily_digest.py || echo "Komugiko failed"
      - name: Check & Run The AI Breakdown Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai_breakdown_digest.py || echo "AI Breakdown failed"

      - name: Check & Run NYT Hard Fork Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/hard_fork_digest.py || echo "Hard Fork failed"
